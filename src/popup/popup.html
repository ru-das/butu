<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Butu</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="./popup.css">
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img class="butu" src="./butu.svg" width="100" height="104" alt="Butu, a smiling teddy bear waving hello">
        <h1>Hi! What are we<br>working on today?</h1>
      </header>
      <form id="session-form" hidden>
        <label for="task">Our little task</label>
        <textarea id="task" name="task" rows="2" required placeholder="Finish the DBMS assignment" aria-describedby="task-hint"></textarea>
        <p id="task-hint" class="hint">3–200 characters. One thing at a time.</p>
        <label for="duration">How long shall we sit together?</label>
        <select id="duration" name="duration"></select>
        <div id="custom-duration" hidden>
          <label for="minutes">Minutes</label>
          <input id="minutes" name="minutes" type="number" min="1" step="1" inputmode="numeric" disabled>
        </div>
        <button id="start" type="submit">Let's do it together!</button>
      </form>
      <section id="active-session" aria-labelledby="session-heading" hidden>
        <h2 id="session-heading">I'm right here with you.</h2>
        <p id="session-task"></p>
        <p class="countdown"><span id="countdown" role="timer" aria-label="Time remaining" aria-live="off">00:00</span><span class="hint">left together</span></p>
      </section>
      <p id="status" role="status">Just a moment…</p>
    </main>
  </body>
</html>
